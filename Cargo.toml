[package]
name = "forma"
version = "5.0.0-alpha.1"
edition = "2021"
description = "Forma, a fast view-only OBJ asset reviewer"
build = "build.rs"

[dependencies]
eframe = { version = "0.29.1", features = ["wgpu", "persistence"] }
bytemuck = { version = "1.16", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "tiff", "bmp"] }
memmap2 = "0.9"
pollster = "0.3"
rayon = "1.10"
rfd = "0.15"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
