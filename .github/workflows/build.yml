name: Build Forma for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null
          cargo build --release *> ci/build.log
          $code = $LASTEXITCODE
          Get-Content ci/build.log -Tail 80
          exit $code
      - name: Self-test
        shell: pwsh
        run: |
          python tests/gen.py tests
          # build machines have no graphics card: run the test copy with Mesa's software OpenGL next to it
          New-Item -ItemType Directory -Force cirun | Out-Null
          Copy-Item target/release/forma.exe cirun/forma.exe
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest" -Headers @{ "User-Agent" = "forma-ci" }
          $asset = $rel.assets | Where-Object { $_.name -like "*release-msvc.7z" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          Copy-Item mesa/x64/*.dll cirun/
          "mesa: $($asset.name)" | Add-Content ci/selftest.txt
          $env:GALLIUM_DRIVER = "llvmpipe"
          $exe = (Resolve-Path cirun/forma.exe).Path
          foreach ($m in @('test_asset', 'blob', 'terrain')) {
            $p = Start-Process -FilePath $exe -ArgumentList @('--selftest', "tests/$m.obj", "ci/$m") -Wait -PassThru -NoNewWindow
            "$m exit $($p.ExitCode)" | Add-Content ci/selftest.txt
          }
          Get-Content ci/*.txt
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/forma.exe dist/Forma.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-windows
          path: dist/Forma.exe
      - name: Publish build report
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "forma-ci"
          git config user.email "forma-ci@users.noreply.github.com"
          $sha = git rev-parse --short HEAD
          Copy-Item -Recurse ci $env:RUNNER_TEMP/ci
          git checkout --orphan ci-results
          git rm -rf --cached . | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item -Recurse $env:RUNNER_TEMP/ci/* .
          "$sha" | Set-Content commit.txt
          git add -A
          git commit -m "Build report for $sha"
          git push -f origin ci-results
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          "pre=$($v.Contains('-'))".ToLower() | Out-File -Append $env:GITHUB_OUTPUT
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Forma ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.ver.outputs.pre }}
          files: dist/Forma.exe
          body: |
            Download **Forma.exe** below and run it. Nothing to install.
            The first time, Windows SmartScreen may warn about an unknown app: choose **More info**, then **Run anyway**.
